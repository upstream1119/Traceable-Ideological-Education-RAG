<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
  <title id="title">KG-RAG 证据链到时空展示层架构图</title>
  <desc id="desc">从用户问题、检索、生成和审查到 Web 时空沙盘及未来数字人和 XR 展示层的可溯源证据链。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowFuture" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <style>
      .canvas { fill: #FFFFFF; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 42px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #475569; }
      .band-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 26px; font-weight: 700; fill: #0F172A; }
      .section-note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #475569; }
      .node-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 21px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .node-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #334155; text-anchor: middle; }
      .node-small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #475569; text-anchor: middle; }
      .status-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .status-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #334155; }
      .legend { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #334155; }
      .current-band { fill: #F4F8FF; stroke: #185A9D; stroke-width: 2; }
      .p1-band { fill: #FFFDF7; stroke: #9A6700; stroke-width: 2; }
      .future-band { fill: #FAFAFA; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 12 8; }
      .current-node { fill: #EAF3FF; stroke: #185A9D; stroke-width: 2; }
      .p1-node { fill: #FFF4D6; stroke: #9A6700; stroke-width: 2; }
      .future-node { fill: #F4F4F5; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 9 6; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .future-flow { fill: none; stroke: #6B7280; stroke-width: 3; stroke-dasharray: 9 6; marker-end: url(#arrowFuture); }
      .helper { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="2200" height="1280"/>

  <text class="title" x="70" y="72">从 KG-RAG 证据链到时空课堂展示</text>
  <text class="subtitle" x="70" y="108">面向教师的系统说明：实线为当前链路，黄色区域为 P1 展示层承接设计，虚线为未来课堂展示方向</text>

  <rect x="1510" y="48" width="180" height="38" rx="6" fill="#EAF3FF" stroke="#185A9D"/>
  <text class="legend" x="1530" y="73">当前已实现</text>
  <rect x="1710" y="48" width="180" height="38" rx="6" fill="#FFF4D6" stroke="#9A6700"/>
  <text class="legend" x="1730" y="73">P1 承接设计</text>
  <rect x="1910" y="48" width="220" height="38" rx="6" fill="#F4F4F5" stroke="#6B7280" stroke-dasharray="7 5"/>
  <text class="legend" x="1930" y="73">未来课堂展示</text>

  <!-- Current evidence chain -->
  <rect class="current-band" x="45" y="155" width="2110" height="380" rx="14"/>
  <text class="band-title" x="75" y="200">当前已实现：可溯源 KG-RAG 最小闭环</text>
  <text class="section-note" x="75" y="229">当前语料：v1 196 条 + v2 49 条 = 245 条 chunks；默认轻量检索，FAISS 仅为可选后端。</text>

  <rect class="current-node" x="75" y="292" width="160" height="116" rx="10"/>
  <text class="node-title" x="155" y="335">用户问题</text>
  <text class="node-text" x="155" y="367">自然语言提问</text>

  <rect class="current-node" x="280" y="292" width="160" height="116" rx="10"/>
  <text class="node-title" x="360" y="335">/retrieve</text>
  <text class="node-text" x="360" y="367">核心检索接口</text>

  <rect class="current-node" x="485" y="272" width="250" height="156" rx="10"/>
  <text class="node-title" x="610" y="316">检索后端</text>
  <rect x="507" y="334" width="205" height="32" rx="5" fill="#FFFFFF" stroke="#185A9D"/>
  <text class="node-text" x="610" y="356">默认：轻量检索</text>
  <rect x="507" y="376" width="205" height="32" rx="5" fill="#FFFFFF" stroke="#185A9D"/>
  <text class="node-text" x="610" y="398">可选：FAISS</text>

  <rect class="current-node" x="780" y="292" width="160" height="116" rx="10"/>
  <text class="node-title" x="860" y="335">GraphSim</text>
  <text class="node-text" x="860" y="367">实体扩展与路径解释</text>

  <rect class="current-node" x="985" y="292" width="180" height="116" rx="10"/>
  <text class="node-title" x="1075" y="329">hybrid_hits</text>
  <text class="node-small" x="1075" y="359">证据、citation</text>
  <text class="node-small" x="1075" y="382">向量/图谱/融合分数</text>

  <rect class="current-node" x="1210" y="292" width="160" height="116" rx="10"/>
  <text class="node-title" x="1290" y="335">生成回答</text>
  <text class="node-text" x="1290" y="367">基于证据组织表达</text>

  <rect class="current-node" x="1415" y="272" width="170" height="156" rx="10"/>
  <text class="node-title" x="1500" y="317">溯源审查</text>
  <text class="node-text" x="1500" y="350">source_check</text>
  <line x1="1440" y1="368" x2="1560" y2="368" stroke="#185A9D" stroke-width="1"/>
  <text class="node-title" x="1500" y="395">红线审查</text>
  <text class="node-text" x="1500" y="416">policy_check</text>

  <rect class="current-node" x="1630" y="292" width="180" height="116" rx="10"/>
  <text class="node-title" x="1720" y="330">agent_trace</text>
  <text class="node-small" x="1720" y="361">检索、生成、审查</text>
  <text class="node-small" x="1720" y="383">过程状态</text>

  <rect class="current-node" x="1855" y="272" width="240" height="156" rx="10"/>
  <text class="node-title" x="1975" y="316">final_decision</text>
  <text class="node-text" x="1975" y="349">最终输出闸门</text>
  <text class="node-small" x="1975" y="378">控制回答展示与播报</text>
  <text class="node-small" x="1975" y="401">不由前端自行绕过</text>

  <path class="flow" d="M235 350 H280"/>
  <path class="flow" d="M440 350 H485"/>
  <path class="flow" d="M735 350 H780"/>
  <path class="flow" d="M940 350 H985"/>
  <path class="flow" d="M1165 350 H1210"/>
  <path class="flow" d="M1370 350 H1415"/>
  <path class="flow" d="M1585 350 H1630"/>
  <path class="flow" d="M1810 350 H1855"/>
  <path class="helper" d="M610 428 V450 H360"/>
  <text class="node-small" x="487" y="464">启用 FAISS：DACHUANG_VECTOR_BACKEND=faiss + 有效 DACHUANG_FAISS_INDEX_DIR</text>
  <text class="node-small" x="487" y="490">FAISS 未配置、索引/API Key 缺失、Embedding 失败或维度错误时回退轻量检索</text>

  <!-- P1 display-layer design -->
  <rect class="p1-band" x="45" y="580" width="2110" height="350" rx="14"/>
  <text class="band-title" x="75" y="626">P1 展示层承接：把可溯源证据转成可阅读的时空展示</text>
  <text class="section-note" x="75" y="655">这是图件与交互设计，不表示正式前端已经上线；展示节点依据 P0 映射与正式数据。</text>

  <rect class="p1-node" x="115" y="720" width="255" height="130" rx="10"/>
  <text class="node-title" x="242" y="760">地图点</text>
  <text class="node-text" x="242" y="793">可信地标与高亮状态</text>
  <text class="node-small" x="242" y="820">仅使用有地点依据的节点</text>

  <rect class="p1-node" x="440" y="720" width="255" height="130" rx="10"/>
  <text class="node-title" x="567" y="760">时间线事件</text>
  <text class="node-text" x="567" y="793">正式或 proposed 节点</text>
  <text class="node-small" x="567" y="820">无地点依据也可承接</text>

  <rect class="p1-node" x="765" y="720" width="255" height="130" rx="10"/>
  <text class="node-title" x="892" y="760">citation 卡片</text>
  <text class="node-text" x="892" y="793">来源、章节、页码与分数</text>
  <text class="node-small" x="892" y="820">页码缺失时说明原因</text>

  <rect class="p1-node" x="1090" y="720" width="255" height="130" rx="10"/>
  <text class="node-title" x="1217" y="760">流程与审查状态</text>
  <text class="node-text" x="1217" y="793">agent_trace 与两类审查</text>
  <text class="node-small" x="1217" y="820">解释“为何可用/需复核”</text>

  <rect class="p1-node" x="1415" y="720" width="300" height="130" rx="10"/>
  <text class="node-title" x="1565" y="760">回答展示与播报控制</text>
  <text class="node-text" x="1565" y="793">仅遵从 final_decision</text>
  <text class="node-small" x="1565" y="820">回答、TTS、数字人共享同一闸门</text>

  <path class="helper" d="M1075 408 V690 H242"/>
  <text class="node-small" x="420" y="680">hybrid_hits / citation 映射承接证据展示</text>
  <path class="flow" d="M242 690 V720"/>
  <path class="flow" d="M567 690 V720"/>
  <path class="flow" d="M892 690 V720"/>
  <path class="helper" d="M1720 408 V690 H1217"/>
  <text class="node-small" x="1300" y="680">agent_trace 承接流程与审查状态</text>
  <path class="flow" d="M1217 690 V720"/>
  <path class="flow" d="M1975 428 V685 H1565 V720"/>
  <path class="helper" d="M892 850 V882 H242 V850"/>
  <text class="node-small" x="567" y="903">地图点、时间线事件与 citation 卡片可双向高亮和筛选</text>

  <!-- Decision states -->
  <rect x="1750" y="704" width="350" height="184" rx="10" fill="#FFFFFF" stroke="#9A6700" stroke-width="2"/>
  <text class="status-title" x="1775" y="736">final_decision 输出规则</text>
  <rect x="1775" y="753" width="300" height="28" rx="4" fill="#E7F6EC"/>
  <text class="status-text" x="1785" y="774">approved：允许展示与播报</text>
  <rect x="1775" y="792" width="300" height="38" rx="4" fill="#FFF4D6"/>
  <text class="status-text" x="1785" y="808">needs_review：待人工复核</text>
  <text class="status-text" x="1785" y="824">显示复核原因，禁止播报</text>
  <rect x="1775" y="840" width="300" height="38" rx="4" fill="#FDECEC"/>
  <text class="status-text" x="1785" y="856">blocked：显示阻断原因</text>
  <text class="status-text" x="1785" y="872">禁止播报</text>

  <!-- Future classroom display -->
  <rect class="future-band" x="45" y="980" width="2110" height="210" rx="14"/>
  <text class="band-title" x="75" y="1025">未来课堂展示方向：以已批准的证据和回答为素材，不脱离证据自由生成</text>
  <text class="section-note" x="75" y="1054">虚线表示后续工作，不表示本阶段已经实现。</text>

  <rect class="future-node" x="500" y="1084" width="210" height="70" rx="10"/>
  <text class="node-title" x="605" y="1127">TTS</text>
  <rect class="future-node" x="790" y="1084" width="210" height="70" rx="10"/>
  <text class="node-title" x="895" y="1127">字幕</text>
  <rect class="future-node" x="1080" y="1084" width="260" height="70" rx="10"/>
  <text class="node-title" x="1210" y="1127">轻量数字人讲解</text>
  <rect class="future-node" x="1420" y="1084" width="260" height="70" rx="10"/>
  <text class="node-title" x="1550" y="1127">XR / 时空沙盘</text>
  <path class="future-flow" d="M1565 850 V1058 H605 V1084"/>
  <text class="node-small" x="1070" y="1048">仅 approved 进入未来讲解链路</text>
  <path class="future-flow" d="M710 1119 H790"/>
  <path class="future-flow" d="M1000 1119 H1080"/>
  <path class="future-flow" d="M1340 1119 H1404"/>

  <text class="section-note" x="70" y="1240">事实边界：默认检索为轻量检索；FAISS 为可选后端；P1 图件不等同于已上线前端；未来数字人/XR 受 final_decision 控制。</text>
</svg>
